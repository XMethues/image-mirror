name: image-mirror

on:
  issues:
    types:
      - opened
      - reopened
      - edited

jobs:
  sync_to_target_registry:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.actor }}-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare image source
        id: image_source
        run: |
          echo "source=issue" >> $GITHUB_OUTPUT
          echo "${{ github.event.issue.body }}" > issue_body.txt

      - name: Check issue body for image format
        id: check_body
        run: |
          python .github/scripts/check_image_format.py "$(cat issue_body.txt)"

      - name: Add comment if body is not image format
        if: steps.check_body.outputs.is_image_format == 'false'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            @${{ github.event.issue.user.login }} 
            ⚠️ 请使用标准镜像格式
            1. 镜像要带 tag，如 nginx，请写为 nginx:latest
            2. issue 描述部分，每行一个镜像，不要有其他内容
            3. 你可以直接编辑更新你的 issue
          reactions: eyes
          edit-mode: replace

      - name: Update issue title with image summary
        if: steps.check_body.outputs.is_image_format == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const body = context.payload.issue.body;

            const lines = body.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
            const images = lines.slice(1);

            const top3 = images.slice(0, 3).join(' | ');
            const total = images.length;

            const newTitle = `${top3} (共 ${total} 个镜像)`;

            await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              title: newTitle
            });

      - name: Add image-mirror label
        if: steps.check_body.outputs.is_image_format == 'true'
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: 'image-mirror'

      - name: Find existing comment
        if: steps.check_body.outputs.is_image_format == 'true'
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.issue.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Syncing image to TargetRegistry'

      - name: Create initial comment
        if: steps.check_body.outputs.is_image_format == 'true' && steps.fc.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            🚀 开始同步镜像到目标仓库，请稍候...
            [查看进度](https://github.com/${{ github.repository_owner }}/image-mirror/actions/runs/${{ github.run_id }})
          reactions: rocket

      - name: Install Skopeo
        if: steps.check_body.outputs.is_image_format == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Prepare image list
        if: steps.check_body.outputs.is_image_format == 'true'
        id: prepare
        env:
          TARGET_NAMESPACE: ${{ vars.TARGET_NAMESPACE }}
          TARGET_REGISTRY: ${{ vars.TARGET_REGISTRY }}
        run: |
          cat issue_body.txt > images-raw.txt
          
          # 清理文件
          sed -e 's/^[ \t]*//g' \
              -e 's/[ \t]*$//g' \
              -e '/^[[:space:]]*$/d' \
              images-raw.txt | tail -n +2 > images-clean.txt
          
          > source-images.txt
          > target-images.txt
          > sync-mapping.txt
          > pull-commands.txt
          
          while IFS= read -r source_image; do
            tag_name=$(echo "$source_image" | awk -F "/" '{print $NF}')
            target_image="${TARGET_REGISTRY}/${TARGET_NAMESPACE}/${tag_name}"
            
            echo "$source_image" >> source-images.txt
            echo "$target_image" >> target-images.txt
            echo "$source_image -> $target_image" >> sync-mapping.txt
            
            # 生成 pull 命令
            echo "docker pull $target_image" >> pull-commands.txt
          done < images-clean.txt
          
          image_count=$(wc -l < source-images.txt)
          echo "image_count=$image_count" >> $GITHUB_OUTPUT
          echo "registry=${TARGET_REGISTRY}" >> $GITHUB_OUTPUT
          echo "namespace=${TARGET_NAMESPACE}" >> $GITHUB_OUTPUT
          
          echo "=== 待同步镜像列表 ==="
          cat sync-mapping.txt

      - name: Sync images with Skopeo
        if: steps.check_body.outputs.is_image_format == 'true'
        id: sync
        env:
          TARGET_REGISTRY_PASSWORD: ${{ secrets.TARGET_REGISTRY_PASSWORD }}
          TARGET_REGISTRY_USER: ${{ vars.TARGET_REGISTRY_USER }}
          TARGET_NAMESPACE: ${{ vars.TARGET_NAMESPACE }}
          TARGET_REGISTRY: ${{ vars.TARGET_REGISTRY }}
        run: |
          if [ -n "$TARGET_REGISTRY_USER" ] && [ -n "$TARGET_REGISTRY_PASSWORD" ]; then
            echo "🔐 登录目标仓库..."
            skopeo login "$TARGET_REGISTRY" \
              --username "$TARGET_REGISTRY_USER" \
              --password "$TARGET_REGISTRY_PASSWORD"
          fi
          
          > sync-success.txt
          > sync-failed.txt
          
          total=$(wc -l < source-images.txt)
          current=0
          
          while IFS= read -r source_image && IFS= read -r target_image <&3; do
            current=$((current + 1))
            echo ""
            echo "[$current/$total] 同步: $source_image"
            echo "         -> $target_image"
            
            if skopeo copy \
              --all \
              --format oci \
              --retry-times 3 \
              "docker://$source_image" \
              "docker://$target_image"; then
              echo "✅ 成功"
              echo "$target_image" >> sync-success.txt
            else
              echo "❌ 失败: $source_image"
              echo "$source_image -> $target_image" >> sync-failed.txt
            fi
          done < source-images.txt 3< target-images.txt
          
          success_count=$(wc -l < sync-success.txt 2>/dev/null || echo 0)
          failed_count=$(wc -l < sync-failed.txt 2>/dev/null || echo 0)
          
          echo "success_count=$success_count" >> $GITHUB_OUTPUT
          echo "failed_count=$failed_count" >> $GITHUB_OUTPUT
          
          echo ""
          echo "=== 同步结果 ==="
          echo "✅ 成功: $success_count"
          echo "❌ 失败: $failed_count"
          
          if [ "$failed_count" -gt 0 ]; then
            echo ""
            echo "=== 失败列表 ==="
            cat sync-failed.txt
            exit 1
          fi

      - name: Add success label
        if: success() && steps.check_body.outputs.is_image_format == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['succeed']
            })

      - name: Prepare comment body
        if: steps.check_body.outputs.is_image_format == 'true'
        id: comment_body
        run: |
          TIMESTAMP=$(date +%s%N)
          
          # 源镜像列表
          if [ -f source-images.txt ] && [ -s source-images.txt ]; then
            echo "source_images<<EOF_SRC_${TIMESTAMP}" >> $GITHUB_OUTPUT
            cat source-images.txt >> $GITHUB_OUTPUT
            echo "EOF_SRC_${TIMESTAMP}" >> $GITHUB_OUTPUT
          else
            echo "source_images=" >> $GITHUB_OUTPUT
          fi
          
          # 目标镜像列表
          if [ -f target-images.txt ] && [ -s target-images.txt ]; then
            echo "target_images<<EOF_TGT_${TIMESTAMP}" >> $GITHUB_OUTPUT
            cat target-images.txt >> $GITHUB_OUTPUT
            echo "EOF_TGT_${TIMESTAMP}" >> $GITHUB_OUTPUT
          else
            echo "target_images=" >> $GITHUB_OUTPUT
          fi
          
          # Pull 命令列表
          if [ -f pull-commands.txt ] && [ -s pull-commands.txt ]; then
            echo "pull_commands<<EOF_PULL_${TIMESTAMP}" >> $GITHUB_OUTPUT
            cat pull-commands.txt >> $GITHUB_OUTPUT
            echo "EOF_PULL_${TIMESTAMP}" >> $GITHUB_OUTPUT
          else
            echo "pull_commands=" >> $GITHUB_OUTPUT
          fi

      - name: Update comment on success
        if: success() && steps.check_body.outputs.is_image_format == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ 镜像同步成功！
            
            [查看详情](https://github.com/${{ github.repository_owner }}/image-mirror/actions/runs/${{ github.run_id }})
            
            ## 📋 同步统计
            - 总数: ${{ steps.prepare.outputs.image_count }}
            - 成功: ${{ steps.sync.outputs.success_count }}
            - 失败: ${{ steps.sync.outputs.failed_count }}
            - 目标仓库: `${{ steps.prepare.outputs.registry }}`
            - 命名空间: `${{ steps.prepare.outputs.namespace }}`
            
            ## 🚀 Pull 命令
            ```bash
            ${{ steps.comment_body.outputs.pull_commands }}
            ```
            
            ## 🎯 目标镜像列表
            ```
            ${{ steps.comment_body.outputs.target_images }}
            ```
            
            ## 📦 源镜像列表
            ```
            ${{ steps.comment_body.outputs.source_images }}
            ```
          reactions: hooray
          edit-mode: replace

      - name: Update comment on failure
        if: failure() && steps.check_body.outputs.is_image_format == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            ❌ 镜像同步失败
            
            请检查以下几点：
            - 源镜像名称是否拼写正确？
            - tag 是否存在（如 `latest`、`1.21`）？
            - 是否为公开可拉取的镜像？
            - 如果是私有镜像，目标仓库是否有访问权限？
            
            ## 📊 同步统计
            - 总数: ${{ steps.prepare.outputs.image_count }}
            - 成功: ${{ steps.sync.outputs.success_count || 0 }}
            - 失败: ${{ steps.sync.outputs.failed_count || 0 }}
            
            [查看详细日志](https://github.com/${{ github.repository_owner }}/image-mirror/actions/runs/${{ github.run_id }})
          reactions: confused
